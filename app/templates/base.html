<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- <link rel="stylesheet" href="/app/static/css/styles.css"> -->
    <!-- <link rel="stylesheet" href="/app/static/css/navbar.css"> -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="/app/static/css/styles.css">
    <link rel="stylesheet" href="/app/static/css/navbar.css">
</head>

<body>
    <div class="main_body">
        {% block start%}
        {% endblock %}
        <div class="container contact-container" id="overlay">
            <h1>Contact Us</h1>
            <form id="contactForm">
                <div class="form-group mb-3">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="form-group mb-3">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="form-group mb-3">
                    <label for="message">Message</label>
                    <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>

        <!-- Thank You Modal -->
        <div class="modal fade" id="thankYouModal" tabindex="-1" aria-labelledby="thankYouModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="thankYouModalLabel">Thank You!</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        We have received your message and will get back to you shortly.
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
<!-- Awesome Footer -->
<div class="footer" style="background-color: #1c1c1c; color: #f5f5f5; padding: 40px 0; text-align: center;">
    <div class="container" style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        
        <!-- Brand and Copyright -->
        <div class="footer-left" style="flex: 1; min-width: 200px; margin-bottom: 20px;">
            <h2 style="color: #f5f5f5; font-size: 24px; margin-bottom: 10px;">ScraperApp</h2>
            <p>&copy; 2024 ScraperApp. All rights reserved.</p>
        </div>
        
        <!-- Quick Links -->
        <div class="footer-center" style="flex: 1; min-width: 200px; margin-bottom: 20px;">
            <h3 style="color: #f5f5f5; font-size: 20px; margin-bottom: 10px;">Quick Links</h3>
            <ul style="list-style: none; padding: 0; margin: 0;">
                <li><a href="#" style="color: #f5f5f5; text-decoration: none;">Home</a></li>
                <li><a href="#" style="color: #f5f5f5; text-decoration: none;">About Us</a></li>
                <li><a href="#" style="color: #f5f5f5; text-decoration: none;">Services</a></li>
                <li><a href="#" style="color: #f5f5f5; text-decoration: none;">Contact</a></li>
            </ul>
        </div>

        <!-- Social Media Links -->
        <div class="footer-right" style="flex: 1; min-width: 200px; margin-bottom: 20px;">
            <h3 style="color: #f5f5f5; font-size: 20px; margin-bottom: 10px;">Follow Us</h3>
            <div style="display: flex; justify-content: center; gap: 15px;">
                <a href="#" style="color: #f5f5f5; text-decoration: none;" title="Facebook">
                    <i class="fab fa-facebook fa-2x"></i>
                </a>
                <a href="#" style="color: #f5f5f5; text-decoration: none;" title="Twitter">
                    <i class="fab fa-twitter fa-2x"></i>
                </a>
                <a href="#" style="color: #f5f5f5; text-decoration: none;" title="LinkedIn">
                    <i class="fab fa-linkedin fa-2x"></i>
                </a>
                <a href="#" style="color: #f5f5f5; text-decoration: none;" title="Instagram">
                    <i class="fab fa-instagram fa-2x"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Extra Footer Credits -->
    <div class="extra-footer" style="border-top: 1px solid #333; margin-top: 20px; padding-top: 20px; font-size: 14px;">
        <p style="margin: 0;">Designed with ❤️ by the ScraperApp Team</p>
    </div>
</div>

<!-- Include Font Awesome -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function (event) {
            event.preventDefault();
            var myModal = new bootstrap.Modal(document.getElementById('thankYouModal'));
            myModal.show();
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" integrity="sha512-onMTRKJBKz8M1TnqqDuGBlowlH0ohFzMXYRNebz+yOcc5TQr/zAKsthzhuv0hiyUKEiQEQXEynnXCvNTOk50dg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script src="../static/js/home.js"></script>
</body>

</html>
